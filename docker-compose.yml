version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: atlas-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      - REDIS_REPLICATION_MODE=master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
